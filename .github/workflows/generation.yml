name: Run Language Generation

on:
  workflow_dispatch:
    inputs:
      generations:
        description: 'Number of generations to run'
        required: false
        default: '1'
        type: string
  schedule:
    - cron: '0 12 * * *'  # Daily at 12:00 UTC

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run generations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'
        run: |
          GENS=${{ github.event.inputs.generations || 1 }}
          for i in $(seq 1 $GENS); do
            echo "Running generation $i..."
            npm run generation
          done

      - name: Generate report
        run: npm run report

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add corpus/ metrics/
          if ! git diff --quiet --cached; then
            git commit -m "ci: auto-generated language evolution $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "No changes to commit"
          fi
