name: Run Language Generation

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 12 * * *'  # Daily at 12:00 UTC

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare generation
        id: prepare
        run: node dist/cli.js --prepare

      - name: Read rendered prompt
        if: steps.prepare.outputs.needs_llm == 'true'
        id: read_prompt
        run: |
          {
            echo 'content<<PROMPT_EOF_MARKER'
            printf '%s\n' "$(cat "corpus/${{ steps.prepare.outputs.gen_dir }}/prompt.txt")"
            echo 'PROMPT_EOF_MARKER'
          } >> "$GITHUB_OUTPUT"

      - name: Call Claude (subscription auth)
        if: steps.prepare.outputs.needs_llm == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model ${{ steps.prepare.outputs.model }} --allowedTools \"Write\""
          show_full_output: true
          prompt: |
            ${{ steps.read_prompt.outputs.content }}

            ---
            You are acting as an automation step, not a coding assistant, and you have exactly one job: call the Write tool to create the file at this exact path with your JSON array response as its entire content: corpus/${{ steps.prepare.outputs.gen_dir }}/raw-response.txt

            You MUST call the Write tool. Do not print, describe, or summarize the response in your final message - the ONLY acceptable output from you is a Write tool call that creates this file. A response that just states the array in text instead of writing it to that file is a failure. The file's content must be ONLY the raw JSON array - no markdown fences, no commentary, no explanation.

            Do not modify any other files. Do not create a git commit.

      - name: Collect generation
        if: steps.prepare.outputs.needs_llm == 'true'
        run: node dist/cli.js --collect ${{ steps.prepare.outputs.gen_number }}

      - name: Generate report
        run: npm run report

      - name: Commit report
        run: |
          git add metrics/
          if ! git diff --quiet --cached; then
            git commit -m "ci: update metrics timeseries"
          fi

      - name: Push
        run: git push
