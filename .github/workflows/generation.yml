name: Run Language Generation

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 12 * * *'  # Daily at 12:00 UTC

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare generation
        id: prepare
        run: node dist/cli.js --prepare

      - name: Read rendered prompt
        if: steps.prepare.outputs.needs_llm == 'true'
        id: read_prompt
        run: |
          {
            echo 'content<<PROMPT_EOF_MARKER'
            printf '%s\n' "$(cat "corpus/${{ steps.prepare.outputs.gen_dir }}/prompt.txt")"
            echo 'PROMPT_EOF_MARKER'
          } >> "$GITHUB_OUTPUT"

      - name: Call Claude (subscription auth)
        if: steps.prepare.outputs.needs_llm == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model ${{ steps.prepare.outputs.model }}
            --json-schema '{"type":"object","properties":{"pairs":{"type":"array","minItems":200,"maxItems":200,"items":{"type":"object","properties":{"meaningId":{"type":"string"},"form":{"type":"string","pattern":"^[a-z]+$","maxLength":40}},"required":["meaningId","form"],"additionalProperties":false}}},"required":["pairs"],"additionalProperties":false}'
          prompt: |
            ${{ steps.read_prompt.outputs.content }}

            ---
            You are acting as an automation step, not a coding assistant. Respond directly with your answer to the task above - do not write any files or run any commands, just answer.

      - name: Write raw response
        if: steps.prepare.outputs.needs_llm == 'true'
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          node -e "const { pairs } = JSON.parse(process.env.STRUCTURED_OUTPUT); require('fs').writeFileSync(process.argv[1], JSON.stringify(pairs))" "corpus/${{ steps.prepare.outputs.gen_dir }}/raw-response.txt"

      - name: Collect generation
        if: steps.prepare.outputs.needs_llm == 'true'
        run: node dist/cli.js --collect ${{ steps.prepare.outputs.gen_number }}

      - name: Generate report
        run: npm run report

      - name: Commit report
        run: |
          git add metrics/
          if ! git diff --quiet --cached; then
            git commit -m "ci: update metrics timeseries"
          fi

      - name: Restore push credentials
        # The claude-code-action step reconfigures git's credential helper for
        # its own GitHub App token, which clobbers the GITHUB_TOKEN credentials
        # actions/checkout persisted at the start of the job. Re-point the
        # remote at GITHUB_TOKEN explicitly so the final push can authenticate.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Push
        run: git push
